name: 오하아사 크롤러 자동화

on:
  schedule:
    # 한국 시간 기준으로 아침 시간대에 여러 번 실행 기회를 만듭니다.
    # GitHub Actions의 schedule은 지연될 수 있으므로 여러 차례 예약합니다.
    - cron: '50 5 * * *'
      timezone: "Asia/Seoul"
    - cron: '10 6 * * *'
      timezone: "Asia/Seoul"
    - cron: '30 6 * * *'
      timezone: "Asia/Seoul"
    - cron: '50 6 * * *'
      timezone: "Asia/Seoul"
    - cron: '10 7 * * *'
      timezone: "Asia/Seoul"
    - cron: '30 7 * * *'
      timezone: "Asia/Seoul"
    - cron: '50 7 * * *'
      timezone: "Asia/Seoul"
    - cron: '10 8 * * *'
      timezone: "Asia/Seoul"

  workflow_dispatch:

# 같은 크롤러가 동시에 여러 번 실행되는 것을 방지
concurrency:
  group: ohaasa-fortune
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

    # 1. 저장소의 최신 소스코드 가져오기
    - name: 저장소 체크아웃
      uses: actions/checkout@v4

    # 2. 오늘 이미 업데이트되었는지 확인
    # schedule 실행일 때만 검사합니다.
    # 수동 실행(workflow_dispatch)은 항상 실행됩니다.
    - name: 오늘 데이터 업데이트 여부 확인
      if: github.event_name == 'schedule'
      id: check_date
      run: |
        TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')

        if [ -f fortune.json ]; then
          JSON_DATE=$(python -c "import json; print(json.load(open('fortune.json', encoding='utf-8')).get('date', ''))")
        else
          JSON_DATE=""
        fi

        echo "오늘 날짜: $TODAY"
        echo "현재 fortune.json 날짜: $JSON_DATE"

        if [ "$JSON_DATE" = "$TODAY" ]; then
          echo "오늘 데이터가 이미 존재합니다."
          echo "already_updated=true" >> "$GITHUB_OUTPUT"
        else
          echo "오늘 데이터가 아직 없습니다."
          echo "already_updated=false" >> "$GITHUB_OUTPUT"
        fi

    # 3. 이미 오늘 데이터가 있다면 이후 작업을 건너뜁니다.
    - name: 오늘 데이터가 이미 있으면 종료
      if: github.event_name == 'schedule' && steps.check_date.outputs.already_updated == 'true'
      run: |
        echo "오늘의 오하아사 운세는 이미 업데이트되었습니다."
        exit 0

    # 4. Python 3.10 설치
    - name: 파이썬 3.10 설치
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 5. 의존성 라이브러리 설치
    - name: 의존성 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi

    # 6. Playwright 설치
    - name: Playwright 크롬 엔진 설치
      run: |
        pip install playwright
        playwright install chromium

    # 7. 크롤러 실행
    - name: 크롤러(scrape.py) 실행
      run: python scrape.py

    # 8. fortune.json의 날짜를 한국 시간 기준으로 맞춤
    # scrape.py는 현재 datetime.now()를 사용하므로,
    # GitHub Actions의 UTC 환경에서 날짜가 하루 전으로 기록되는 문제를 방지합니다.
    - name: fortune.json 날짜를 한국 시간으로 보정
      run: |
        TODAY=$(TZ=Asia/Seoul date +'%Y-%m-%d')

        python - "$TODAY" <<'PY'
        import json
        import sys

        today = sys.argv[1]

        with open("fortune.json", "r", encoding="utf-8") as f:
            data = json.load(f)

        data["date"] = today

        with open("fortune.json", "w", encoding="utf-8") as f:
            json.dump(data, f, ensure_ascii=False, indent=2)
            f.write("\n")

        print(f"fortune.json 날짜를 {today}로 설정했습니다.")
        PY

    # 9. 변경사항 커밋 및 푸시
    - name: 변경사항(fortune.json)을 깃허브에 커밋 및 푸시
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add fortune.json

        if ! git diff --quiet || ! git diff --staged --quiet; then
          git commit -m "Update fortune.json ($(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M'))"
          git pull --rebase origin main
          git push origin main
        else
          echo "업데이트할 변경사항이 없습니다."
        fi
